<!DOCTYPE html>
<html>
<head>
    <title>PS1 Portal - Master Build</title>
    <script src="wasmpsx.min.js" defer></script>
    <style>
        body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: sans-serif; }
        .ui { background: #111; padding: 10px; position: relative; z-index: 100; border-bottom: 2px solid #333; }
        
        #viewport {
            width: 100vw;
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        wasmpsx-player {
            transform: scale(2.0); /* Increase this to 2.2 if the screen is still too small */
            transform-origin: center;
        }

        canvas { image-rendering: pixelated; }
        button, input { background: #333; color: #fff; border: 1px solid #555; padding: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="ui">
        <input type="file" id="rom-input">
        <button id="export-btn">SAVE TO DEVICE</button>
        <button onclick="document.getElementById('import-input').click()">LOAD FROM DEVICE</button>
        <input type="file" id="import-input" style="display:none">
        <span id="kb-status" style="color:yellow; font-size: 12px; margin-left:10px;">Load game then click screen for controls</span>
    </div>

    <div id="viewport">
        <wasmpsx-player id="emu"></wasmpsx-player>
    </div>

    <script>
        const player = document.getElementById('emu');

        // Manual Key Map
        const keyMap = {
            'x': 'cross', 'z': 'circle', 's': 'square', 'a': 'triangle',
            'Enter': 'start', 'Shift': 'select',
            'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right'
        };

        window.onload = () => {
            // Load Game
            document.getElementById('rom-input').onchange = (e) => {
                player.readFile(e.target.files[0]);
                document.getElementById('kb-status').innerText = "SYSTEM ACTIVE - CLICK GAME SCREEN";
            };

            // Inject Controls
            window.addEventListener('keydown', (e) => {
                if (keyMap[e.key]) player.setButtonState(keyMap[e.key], true);
            });
            window.addEventListener('keyup', (e) => {
                if (keyMap[e.key]) player.setButtonState(keyMap[e.key], false);
            });

            // Export Save (Extract from Emulator)
            document.getElementById('export-btn').onclick = () => {
                try {
                    // This pulls the Memory Card file from the virtual file system
                    const data = player.fs.readFile('mcd0.mcd');
                    const blob = new Blob([data], { type: "application/octet-stream" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "ps1_save.mcd";
                    a.click();
                } catch(e) { 
                    alert("Error: No save data found. Make sure you saved at a point in the game first."); 
                }
            };

            // Import Save (Inject into Emulator)
            document.getElementById('import-input').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    player.readFile(file);
                    alert("Memory Card inserted. You can now load your save in the game menu.");
                }
            };
        };
    </script>
</body>
</html>
